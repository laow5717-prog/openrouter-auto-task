# ==========================================
# OpenRouter Auto Task - 配置文件模板
# 使用说明:
# 1. 复制此文件为 config.yaml
# 2. 编辑 config.yaml 中的配置
# ==========================================

# 注册配置
registration:
  total_accounts: 1      # 批量注册的账号数量

# 临时邮箱配置 (使用 mail.tm 免费 API，无需自行部署)
email:
  wait_timeout: 120      # 等待验证邮件的最大超时时间(秒)
  poll_interval: 3       # 轮询检查邮件的间隔(秒)

# 浏览器自动化配置
browser:
  max_wait_time: 600     # 全局最大等待时间
  short_wait_time: 120   # 短任务等待时间
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 账号密码规则
password:
  length: 16
  charset: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%"

# 错误重试策略
retry:
  http_max_retries: 5
  http_timeout: 30
  error_page_max_retries: 5
  button_click_max_retries: 3

# 批量注册间隔
batch:
  interval_min: 5        # 最小间隔(秒)
  interval_max: 15       # 最大间隔(秒)

# 每日流水线并发配置
concurrency:
  max_workers: 2              # 同时驱动的浏览器数，1-4。设为 1 即退回串行（应急止血用）
                              # 每个实例是有头 Chrome，约占 300-500MB 内存
  claim_timeout_minutes: 20   # 卡被领取后多久无进展视为 worker 失联，自动回收为 pending

# AdsPower 指纹浏览器（每日任务的浏览器启动方式）
# enabled=false 时走本地 Chrome 持久 profile（data/profiles/<email>），与接入前一致；
# enabled=true 时每个账号绑定一个 AdsPower 环境，环境创建时绑定一个独立代理出口 IP。
# 注意：AdsPower 环境数有套餐上限（当前账号实测 12），配额满时会自动删除已充值成功
# 账号对应的环境来腾位置。api_key 在客户端「自动化 - API - API Key」里复制。
adspower:
  enabled: false
  base_url: "http://local.adspower.net:50325"
  api_key: ""
  group_id: "0"           # 新建环境归入的分组，"0" = 未分组
  reclaim_batch: 3        # 配额满时单次回收几个环境
  # 环境指纹的操作系统。留空用代码默认（Windows 10/11 + macOS 12/13）。
  # 只能填桌面系统：AdsPower 不指定时会在所有系统里随机（含 Android/iOS/Linux），
  # 移动端 UA 会让 GitHub / Stripe 返回移动版页面，本项目的选择器全是按桌面版写的。
  # 可选值：Windows 7/8/10/11、Mac OS X 10/11/12/13
  ua_systems: []

# 验证码服务配置 (2Captcha)
captcha:
  api_key: ""              # 2Captcha API Key
  service: "2captcha"

# 信用卡信息 (通过 Web UI 输入，以下为默认值)
# 支持多张信用卡，每个账号最多绑定 2 张
# 每张卡包含独立的账单地址
payment:
  max_bindable_cards: 2
  credit_cards: []

# 本地数据库配置
database:
  path: "data/openrouter_auto.db"

# 文件路径配置 (legacy, 首次启动时自动迁移到数据库)
files:
  accounts_file: "registered_accounts.txt"
