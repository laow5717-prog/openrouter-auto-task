[project]
name = "openrouter-auto-task"
version = "0.1.0"
description = "Automated OpenRouter account registration and credit binding tool using Patchright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "2captcha-python>=1.5.0",
    "faker>=40.1.0",
    "flask>=3.1.2",
    "openpyxl>=3.1.0",
    "patchright>=1.61.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "undetected-chromedriver>=3.5.5",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
