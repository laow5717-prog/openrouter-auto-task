[project]
name = "openrouter-auto-task"
version = "0.1.0"
description = "Automated OpenRouter account registration and credit binding tool using Patchright."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "2captcha-python>=1.5.0",
    "faker>=40.1.0",
    "flask>=3.1.2",
    "openpyxl>=3.1.0",
    "patchright>=1.61.0",
    "playwright>=1.61.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "selenium>=4.39.0",
    "undetected-chromedriver>=3.5.5",
    "waitress>=3.0.2",
    # src/browser/cdp_inject.py 的原始 CDP 前置注入（Stripe hCaptcha）。那里是
    # try/except ImportError 的软导入，缺了只打一行日志就静默降级——开发机装过所以
    # 一直没暴露，而 CI 用 `pip install .` 装依赖，没声明就等于打包版必然缺。
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
